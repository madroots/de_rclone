name: Build AppImage

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: |
        npm ci

    # Optional: lets the real-rclone integration tests run. They skip cleanly when
    # rclone is absent, so a slow or failing package mirror must not block the build.
    - name: Install rclone (config validation integration tests)
      timeout-minutes: 3
      continue-on-error: true
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -o Acquire::Retries=2
        sudo apt-get install -y --no-install-recommends rclone
        rclone version

    - name: Check Syntax and Run Regression Tests
      run: |
        npm run check
        npm test

    # Tag, package.json and package-lock.json versions must agree, and no published
    # release may already exist for the tag (electron-builder would skip the upload).
    - name: Release Gate (before build)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run release:gate -- --pre "$GITHUB_REF_NAME"

    - name: Build AppImage (No Publish)
      if: startsWith(github.ref, 'refs/tags/') != true
      run: |
        npm run dist -- --linux AppImage --publish never

    - name: Upload AppImage Artifact
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v7
      with:
        name: de_rclone-AppImage
        path: dist/*.AppImage

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Dependencies
      run: |
        npm ci

    - name: Build and Publish AppImage (Draft Release)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run dist -- --linux AppImage --publish always

    - name: Release Gate (draft with AppImage and latest-linux.yml)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run release:gate -- "$GITHUB_REF_NAME"

    - name: Publish Release with Release Notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        notes=$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')
        if [[ ! "$notes" =~ [^[:space:]] ]]; then
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq '.body')
        fi
        gh release edit "$RELEASE_TAG" \
          --title "de_rclone $RELEASE_TAG" \
          --notes "$notes" \
          --draft=false
