name: Build AppImage

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Validate Release Tag
      if: startsWith(github.ref, 'refs/tags/')
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        node -e 'const expected = `v${require("./package.json").version}`; if (process.env.RELEASE_TAG !== expected) { console.error(`Release tag must be ${expected}, received ${process.env.RELEASE_TAG}`); process.exit(1); }'
        
    - name: Install Dependencies
      run: |
        npm ci

    - name: Check Syntax and Run Regression Tests
      run: |
        npm run check
        npm test
        
    - name: Build AppImage (No Publish)
      if: startsWith(github.ref, 'refs/tags/') != true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run dist -- --linux AppImage --publish never

    - name: Upload AppImage Artifact
      if: startsWith(github.ref, 'refs/tags/') != true
      uses: actions/upload-artifact@v7
      with:
        name: de_rclone-AppImage
        path: dist/*.AppImage

    - name: Build and Publish AppImage (Release)
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        npm run dist -- --linux AppImage --publish always

    - name: Publish Release with Release Notes
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        notes=$(gh release view "$RELEASE_TAG" --json body --jq '.body // ""')
        if [[ ! "$notes" =~ [^[:space:]] ]]; then
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq '.body')
        fi
        gh release edit "$RELEASE_TAG" \
          --title "de_rclone $RELEASE_TAG" \
          --notes "$notes" \
          --draft=false
